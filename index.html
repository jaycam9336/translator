<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#002244">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Spanslator">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Spanslator</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);height:100dvh;gap:10px;overflow:hidden}
  #out{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border:3px solid #444;border-radius:16px;padding:12px;margin-top:10px;overflow:hidden}
  #orig{flex:0 0 auto;font-size:16px;line-height:1.3;color:#bbb;max-height:22%;overflow:auto;min-height:1.3em}
  #orig b{color:#888;font-weight:600}
  #status{flex:0 0 auto;font-size:18px;font-weight:700;min-height:1.4em;padding:4px 0;color:#bbb}
  #status.live{color:#4cd964}
  #status.busy{color:#ffd600}
  #status.warn{color:#ffb340}
  #status.err{color:#ff6b6b}
  #status.ok{color:#4dd0ff}
  #tr{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;overflow:auto}
  #trText{font-size:48px;font-weight:800;line-height:1.15;word-break:break-word;width:100%}
  #trText.hint{font-size:24px;font-weight:600;color:#888}
  #trText.err{font-size:26px;color:#ff6b6b}
  #trText.busy{font-size:28px;color:#ffd600}
  #hint{flex:0 0 auto;display:none;font-size:14px;line-height:1.3;color:#ffb340;padding:4px 0}
  #hint.show{display:block}
  #btns{flex:0 0 auto;display:flex;gap:10px;height:26dvh;margin-bottom:0}
  #typed{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  #typed input{width:100%;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid #444;background:#111;color:#fff;font-family:inherit;outline:0;-webkit-appearance:none;appearance:none}
  #typed input:focus{border-color:#4dd0ff}
  #typed .row{display:flex;gap:8px}
  #typed button{flex:1;font-size:16px;font-weight:800;border-radius:12px;padding:10px 4px;display:block;color:#000}
  #tEN{background:#ffd600}
  #tES{background:#4dd0ff}
  button{flex:1;border:0;border-radius:20px;font-size:44px;font-weight:900;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;font-family:inherit;padding:6px}
  button small{font-size:16px;font-weight:700;opacity:.85}
  #e2s{background:#ffd600}
  #s2e{background:#4dd0ff}
  button.on{background:#ff3b30;color:#fff;animation:pulse 1s infinite}
  button:disabled{opacity:.35}
  @keyframes pulse{50%{filter:brightness(.7)}}
</style>
</head>
<body>
<div id="out" aria-live="polite">
  <div id="status" role="status" aria-live="polite"></div>
  <div id="hint" role="note"></div>
  <div id="orig"></div>
  <div id="tr"><div id="trText" class="hint">Tap a button, then talk.<br>Toque un botón y hable.</div></div>
</div>
<div id="btns">
  <button id="e2s" type="button">E2S<small>English → Español</small></button>
  <button id="s2e" type="button">S2E<small>Español → English</small></button>
</div>
<form id="typed" autocomplete="off">
  <input id="typedText" type="text" enterkeyhint="go" autocapitalize="sentences" autocorrect="on" spellcheck="true" placeholder="Or type / use keyboard mic here · Escriba o dicte aquí" aria-label="Text to translate">
  <div class="row">
    <button id="tEN" type="button">English → Español</button>
    <button id="tES" type="button">Español → English</button>
  </div>
</form>
<script src="app.js"></script>
</body>
</html>
