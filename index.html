<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#002244">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Spanslator">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Spanslator</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);height:var(--vh,100dvh);gap:8px;overflow:hidden}
  #out{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border:3px solid #444;border-radius:16px;padding:10px 12px;margin-top:10px;overflow:hidden}
  #status{flex:0 0 auto;font-size:18px;font-weight:700;min-height:1.4em;padding:2px 0;color:#bbb}
  #status.live{color:#4cd964}
  #status.busy{color:#ffd600}
  #status.warn{color:#ffb340}
  #status.err{color:#ff6b6b}
  #status.ok{color:#4dd0ff}
  #orig{flex:0 0 auto;font-size:16px;line-height:1.3;color:#bbb;max-height:22%;overflow:auto;min-height:0}
  #orig b{color:#888;font-weight:600}
  #tr{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;overflow:auto}
  #trText{font-size:48px;font-weight:800;line-height:1.15;word-break:break-word;width:100%}
  #trText.hint{font-size:24px;font-weight:600;color:#888}
  #trText.err{font-size:26px;color:#ff6b6b}
  #trText.busy{font-size:28px;color:#ffd600}
  #typed{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
  #typed input{width:100%;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid #4dd0ff;background:#111;color:#fff;font-family:inherit;outline:0;-webkit-appearance:none;appearance:none}
  #typed input:focus{border-color:#ffd600}
  #typed input:disabled{border-color:#444;opacity:.6}
  #kbhint{font-size:13px;line-height:1.3;color:#999;padding:0 2px}
  #btns{flex:0 0 auto;display:flex;gap:10px;height:28dvh;margin-bottom:0}
  body.kb #btns{height:84px}
  body.kb #kbhint{display:none}
  button{flex:1;border:0;border-radius:20px;font-size:44px;font-weight:900;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;font-family:inherit;padding:6px}
  button small{font-size:16px;font-weight:700;opacity:.85}
  body.kb button{font-size:32px}
  #tts{flex:0 0 48px;height:48px;width:100%;margin-bottom:10px;background:#fff;color:#000;font-size:19px;font-weight:800;border-radius:14px;padding:0;display:block;text-align:center;line-height:48px;-webkit-user-select:none;user-select:none}
  #tts.on{background:#ff3b30;color:#fff;box-shadow:none}
  #tts.na{opacity:.5}
  #e2s{background:#ffd600}
  #s2e{background:#4dd0ff}
  button.on{box-shadow:0 0 0 5px #fff inset}
</style>
</head>
<body>
<div id="out">
  <div id="status" role="status" aria-live="polite"></div>
  <div id="orig"></div>
  <div id="tr"><div id="trText" class="hint">Tap a button, then type or use the keyboard mic.<br>Toque un botón y escriba o use el micrófono del teclado.</div></div>
</div>
<form id="typed" autocomplete="off" action="#">
  <input id="typedText" type="text" lang="en" disabled enterkeyhint="go" autocapitalize="sentences" autocorrect="on" autocomplete="off" spellcheck="true" placeholder="Tap E2S or S2E first · Toque E2S o S2E" aria-label="Text to translate">
  <div id="kbhint">For Spanish voice, tap the 🌐 key to switch to the Spanish keyboard first.</div>
</form>
<div id="btns">
  <button id="e2s" type="button">E2S<small>English → Español</small></button>
  <button id="s2e" type="button">S2E<small>Español → English</small></button>
</div>
<button id="tts" type="button">Text to Speech</button>
<script src="app.js"></script>
</body>
</html>
